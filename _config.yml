# Feature List                            Edit, add or remove features to be presented.
features:
  - title: Vista route-based weather
    description: Forecast every segment of your route by time and pace—visibility, temperature, rain/snow, wind and gusts at low and high points.
    fontawesome_icon_name: route

  - title: AI prep list (gear & nutrition)
    description: One-tap AI summary plus gear and fueling lists tuned to your sport, forecast, effort, and personal comfort settings.
    fontawesome_icon_name: magic

  - title: Today’s call readiness
    description: See if today is a good day to push or back off using training load, sleep, HRV, resting heart rate, and more from Apple Health.
    fontawesome_icon_name: heart-pulse

  - title: Import routes from everywhere
    description: Bring in routes from Strava, Ride with GPS, GPX/FIT files, and Apple Fitness workouts—then save Vista forecasts for offline use.
    fontawesome_icon_name: cloud-arrow-down

  - title: Progress & training insight
    description: Track weekly load, duration, distance, elevation gain, active energy, and a compact VO₂Max trend to see how training is stacking up.
    fontawesome_icon_name: chart-line

  - title: Built for safety & privacy
    description: Powered by global weather models (NOAA, ECMWF, JMA and more). Health data stays on your device and flows securely via Apple Health.
    fontawesome_icon_name: shield-heart

